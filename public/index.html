
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RANGER AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090812;color:white;font-family:Arial,sans-serif}
header{padding:20px;border-bottom:1px solid #302044;color:#c084fc;font-size:24px;font-weight:bold}
main{max-width:750px;margin:auto;padding:20px}
h1{margin-top:50px;text-align:center;font-size:35px}
p{text-align:center;color:#aaa}
#chat{height:55vh;overflow:auto;margin-top:30px}
.msg{padding:15px;margin:12px 0;border-radius:14px;line-height:1.6;white-space:pre-wrap}
.user{background:#39205b;margin-left:35px}
.ai{background:#191625;margin-right:35px}
form{display:flex;gap:10px;position:sticky;bottom:10px;background:#090812;padding:10px 0}
input{flex:1;min-width:0;padding:16px;border-radius:14px;border:1px solid #7543a5;background:#171321;color:white;font-size:16px}
button{background:#9333ea;color:white;border:0;border-radius:12px;padding:15px;font-weight:bold}
button:disabled{opacity:.5}
</style>
</head>
<body>
<header>⚡ RANGER AI</header>
<main>
<h1>Welcome to RANGER AI</h1>
<p>Your personal AI assistant. Ask me anything!</p>
<div id="chat"></div>
<form id="form">
<input id="message" placeholder="Ask RANGER AI anything..." required>
<button id="send">Send</button>
</form>
</main>
<script>
const form=document.getElementById("form");
const input=document.getElementById("message");
const chat=document.getElementById("chat");
const send=document.getElementById("send");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 const message=input.value.trim();
 if(!message)return;
 addMessage(message,"user");
 input.value="";
 send.disabled=true;
 send.textContent="...";
 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Request failed");
  addMessage(data.reply,"ai");
 }catch(error){
  addMessage("Sorry bro! "+error.message,"ai");
 }
 send.disabled=false;
 send.textContent="Send";
 input.focus();
});
</script>
</body>
</html>
